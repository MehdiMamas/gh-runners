name: e2e

# End-to-end test on hosted macOS and Linux machines: install gh-runners,
# register two runners for the same test repo with a registration token,
# start them with the login service, wait until each has run a job from that
# repo, then remove the second and check the first keeps running.
#
# 1. Put a registration token for the test repo in the E2E_REGISTRATION_TOKEN
#    secret (POST /repos/{owner}/{repo}/actions/runners/registration-token;
#    it expires after an hour).
# 2. gh workflow run e2e.yml -f repo=owner/test-repo
# 3. Once the runners are online, run a workflow in the test repo with
#    runs-on: [self-hosted, e2e-<this run id>-<os>] and one with
#    runs-on: [self-hosted, e2e-<this run id>-<os>-2].
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Test repository (owner/repo), private
        required: true
      wait_minutes:
        description: How long to wait for a job
        default: "15"

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
          - os: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: e2e-${{ github.run_id }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          go build -o gh-runners .
          echo "GH_RUNNERS_HOME=$RUNNER_TEMP/gh-runners-home" >> "$GITHUB_ENV"
      - name: add runner
        env:
          REG_TOKEN: ${{ secrets.E2E_REGISTRATION_TOKEN }}
          REPO: ${{ inputs.repo }}
        run: |
          ./gh-runners add "$REPO" --registration-token "$REG_TOKEN" --name "$LABEL" --labels "$LABEL"
          ./gh-runners service install
          # A second runner for the same repo, added while the first runs.
          ./gh-runners add "$REPO" --registration-token "$REG_TOKEN" --another --name "$LABEL-2" --labels "$LABEL-2"
          ./gh-runners list --offline
          ls "$GH_RUNNERS_HOME/runners"
      - name: wait for a job on each runner
        env:
          WAIT: ${{ inputs.wait_minutes }}
          REPO: ${{ inputs.repo }}
        run: |
          base="$GH_RUNNERS_HOME/runners/$(echo "$REPO" | sed 's|/|__|')"
          end=$(( $(date +%s) + WAIT * 60 ))
          for log in "$base/gh-runners.log" "${base}__$LABEL-2/gh-runners.log"; do
            until grep -q "completed with result" "$log" 2>/dev/null; do
              if [ "$(date +%s)" -gt "$end" ]; then
                echo "no job within $WAIT minutes in $log"; cat "$log" || true; exit 1
              fi
              sleep 10
            done
            cat "$log"
            grep -q "completed with result: Succeeded" "$log"
          done
      - name: remove the second runner, the first keeps running
        env:
          REPO: ${{ inputs.repo }}
        run: |
          ./gh-runners remove "$REPO" --runner "$LABEL-2" --force
          ./gh-runners list --offline
          ./gh-runners list --offline --json > list.json
          jq -e --arg n "$LABEL" 'length == 1 and .[0].name == $n and .[0].local == "running"' list.json
      - name: stop and clean up
        if: always()
        run: |
          ./gh-runners service uninstall || true
          ./gh-runners remove --all --force || true
          cat "$GH_RUNNERS_HOME/daemon.log" || true
