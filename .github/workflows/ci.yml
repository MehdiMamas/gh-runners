name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'
      - name: build
        run: go build -o gh-runners$([ "$RUNNER_OS" = Windows ] && echo .exe) .
      - name: smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RUNNERS_HOME: ${{ runner.temp }}/gh-runners-home
        run: |
          set -x
          ./gh-runners --version
          ./gh-runners --help
          ./gh-runners list --offline
          ./gh-runners config
          ./gh-runners doctor || true
      - name: background service install, status, uninstall
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RUNNERS_HOME: ${{ runner.temp }}/gh-runners-home
        run: |
          set -x
          ./gh-runners service install
          ./gh-runners service status
          ./gh-runners list
          # The dashboard answers on the daemon's port: locked without the
          # secret link, unlocked (cookie + redirect) with it.
          addr=$(jq -r .addr "$GH_RUNNERS_HOME/daemon.json")
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://$addr/")
          test "$code" = 401
          key=$(tr -d '[:space:]' < "$GH_RUNNERS_HOME/ui-secret")
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://$addr/?k=$key")
          test "$code" = 303
          ./gh-runners ui --no-browser
          # Restart the way an auto-update does: the daemon spawns the
          # helper, which must bring up a new daemon (#24).
          pid=$(jq -r .pid "$GH_RUNNERS_HOME/daemon.json")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-GHR: 1' -b "ghr_ui=$key" "http://$addr/api/service/restart")
          test "$code" = 202
          for i in $(seq 1 60); do
            new=$(jq -r .pid "$GH_RUNNERS_HOME/daemon.json" 2>/dev/null || true)
            # Not a pipe into grep -q: with pipefail, SIGPIPE fails the test.
            st=$(./gh-runners service status || true)
            if [ -n "$new" ] && [ "$new" != "$pid" ] && [[ "$st" == *"Daemon: running"* ]]; then break; fi
            sleep 2
          done
          test "$new" != "$pid"
          cat "$GH_RUNNERS_HOME/service-restart.log" || true
          ./gh-runners service status
          ./gh-runners list
          ./gh-runners service uninstall
          ./gh-runners service status
      - name: daemon log
        if: always()
        run: cat "$RUNNER_TEMP/gh-runners-home/daemon.log" || true

  release-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sh scripts/build-release.sh ci-${GITHUB_SHA::7}
      - run: |
          file dist/gh-runners-darwin-universal
          dist/gh-runners-darwin-universal --version

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install.sh (latest release)
        if: runner.os != 'Windows'
        run: |
          GH_RUNNERS_BIN="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/gh-runners" --version
          "$RUNNER_TEMP/bin/gh-runners" doctor || true
      - name: install.ps1 (latest release)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GH_RUNNERS_BIN = "$env:RUNNER_TEMP\bin"
          ./install.ps1
          & "$env:RUNNER_TEMP\bin\gh-runners.exe" --version
